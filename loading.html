<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção - Voltaremos em breve</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ajustes para telas bem pequenas */
        @media (max-width: 380px) {
            h1 { font-size: 1.5rem; }
            p { font-size: 1rem; }
        }
        
        /* Estilo simples para o rodapé solicitado */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="icon">🛠️</span>
        <h1>Estamos em Manutenção</h1>
        <p>Estamos trabalhando para melhorar sua experiência. Voltaremos a estar online em breve!</p>
        <div class="loader"></div>
        <div class="footer">@ 2026 Sistema seguro</div>
    </div>

</body>
</html>
